<title>Lerntool</title>
<style>
:root{--bg:#0b0b0b;--fg:#F7F3E8;--mut:#a89f8c;--card:#161513;--bd:#2f2b22;--ac:#BD9B60;--ok:#6cc18b;--okbg:#1b2d22;--no:#f08a82;--nobg:#3a2321;--bar:#2a2620;color-scheme:dark}

*{box-sizing:border-box}body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(1100px 600px at 90% -10%,rgba(189,155,96,.16),transparent 62%),radial-gradient(900px 500px at -10% 108%,rgba(189,155,96,.10),transparent 62%);background-attachment:fixed;color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 60px}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 12px}.brand svg{width:60px;height:60px;flex:none}.brand small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}h1{font-size:19px;margin:0}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:9px 13px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#0b0b0b;font-weight:600}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.q{font-size:18px;font-weight:600;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.opt.pick{border:2px solid var(--ac);background:rgba(189,155,96,.16)}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--nobg);border-color:var(--no)}
.exp{border-left:4px solid var(--ac);padding:8px 12px;margin:10px 0;background:var(--bar);border-radius:6px}

<script>
const DATA=window.QUIZ;const BASE='quiz_'+(DATA.key||'default')+'_v1',PKEY=BASE+'_profiles';let KEY=BASE;
const DAY=864e5,NEED=3,GAP=14*DAY,STAGE=30,REVDELAY=12*3600e3;
let S={progress:{},custom:[],upd:0};
const mem={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
let PR={list:(DATA.users&&DATA.users.length?DATA.users:['Ich']).map((n,i)=>({id:'p'+(i+1),name:n})),cur:'p1'};
try{const r=lsGet(PKEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.list)&&o.list.length)PR=o}}catch(e){}
if(!PR.list.some(x=>x.id===PR.cur))PR.cur=PR.list[0].id;
function keyOf(id){return id==='p1'?BASE:BASE+'_'+id}
function savePR(){lsSet(PKEY,JSON.stringify(PR))}
function loadProfile(){KEY=keyOf(PR.cur);S={progress:{},custom:[],upd:0};try{const r=lsGet(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
loadProfile();
let cmsg='';
function setMsg(m){cmsg=m;const e=document.getElementById('cstat');if(e)e.textContent=m}
function save(){S.upd=Date.now();lsSet(KEY,JSON.stringify(S));setMsg('Automatisch gespeichert auf diesem iPad ✓ '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}))}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let GLMAP={},GLRX=null;
(function(){
 const L=(DATA.gl||[]);if(!L.length)return;
 const forms=[];
 for(const g of L){for(const f of [g.t].concat(g.a||[])){const k=String(f).toLowerCase();if(k&&!GLMAP[k]){GLMAP[k]=g;forms.push(f)}}}
 forms.sort((a,b)=>b.length-a.length);
 const ex=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s+');
 try{GLRX=new RegExp('(^|[^\\p{L}\\p{N}])('+forms.map(ex).join('|')+')(?:s|n|en|e|es)?(?![\\p{L}\\p{N}])','giu')}catch(e){GLRX=null}
})();
function G(s){
 const h=esc(s);if(!GLRX)return h;
 return h.replace(GLRX,(m,pre,form)=>{const g=GLMAP[form.toLowerCase().replace(/\s+/g,' ')]||GLMAP[form.toLowerCase()];if(!g)return m;return pre+'<span class="gl" data-g="'+esc(g.id)+'">'+m.slice(pre.length)+'</span>'});
}
(function(){
 if(!document.addEventListener||!GLRX)return;
 const pop=document.createElement('div');pop.id='glpop';pop.className='hide';document.body.appendChild(pop);
 const byId={};for(const g of DATA.gl)byId[g.id]=g;
 function hide(){pop.classList.add('hide')}
  function stems(s){return new Set((String(s).toLowerCase().match(/[a-zäöüß]{6,}/g)||[]).map(w=>w.slice(0,6)))}
 function locked(el){
  try{if(st.tab!=='learn'||st.answered||!st.cur)return false;const c=el.closest('.card');return !!(c&&c.querySelector('.q'))}catch(e){return false}}
 function leaks(g){
  try{const q=st.cur,a=stems(q.o[q.a]),qq=stems(q.q+' '+g.t),d=stems(g.d);for(const w of d)if(a.has(w)&&!qq.has(w))return true}catch(e){}return false}
 function show(el){
  const g=byId[el.dataset.g];if(!g)return;
  const lk=locked(el);let body;
  if(lk){
   if(g.f===undefined||leaks(g))body='<span style="color:var(--mut)">Die Erklärung erscheint nach deiner Antwort, damit sie die Lösung nicht verrät.</span>';
   else body=esc(g.d)+'<div class="gs">Mehr (Funktion, Details) nach der Antwort.</div>';
  }else body=esc(g.d)+(g.f?'<br>'+esc(g.f):'');
  let src='';if(!lk&&(g.s||g.u)){src='<div class="gs">'+(g.s?esc(g.s):'')+(g.u?' · <a href="'+esc(g.u)+'" target="_blank" rel="noopener">Quelle öffnen</a>':'')+'</div>'}
  pop.innerHTML='<button class="gx" aria-label="Schließen">×</button><b>'+esc(g.t)+'</b>'+body+src;
  pop.classList.remove('hide');pop.style.left='0px';pop.style.top='0px';
  const r=el.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  let x=Math.min(Math.max(10,r.left),vw-pw-10),y=r.bottom+8;
  if(y+ph>vh-10){y=r.top-ph-8;if(y<10)y=Math.max(10,vh-ph-10)}
  pop.style.left=x+'px';pop.style.top=y+'px';
  pop.querySelector('.gx').onclick=ev=>{ev.stopPropagation();hide()};
 }
 document.addEventListener('click',e=>{
  const t=e.target&&e.target.closest?e.target.closest('.gl'):null;
  if(t){e.preventDefault();e.stopPropagation();show(t);return}
  if(!(e.target.closest&&e.target.closest('#glpop')))hide();
 },true);
 document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
})();

function decks(){
 const d=JSON.parse(JSON.stringify(DATA.decks));
 const cu=d.find(x=>x.id==='custom');
 for(const q of S.custom){const t=d.find(x=>x.id===q.deck)||cu;t.q.push(q)}
 return d.filter(x=>x.q.length||x.id!=='custom');
}
function mg(p){if(p.st!==undefined)return p;const c=p.c||0;
 if(c>=5){p.st='pass';p.c=3;p.due=p.due||Date.now()+GAP}
 else if(c>=3){p.st='park';p.c=3;p.pt=Date.now()-REVDELAY;p.due=p.pt+REVDELAY}
 else if(c>0||(p.seen||0)>0){p.st='learn';p.c=c}
 else{p.st='new';p.c=0}
 p.f=(p.wrong||0)>0&&p.st==='learn';p.fs=0;return p}
function peek(id){const p=S.progress[id];return p?mg(p):null}
function P(id){return peek(id)||(S.progress[id]={c:0,due:null,seen:0,wrong:0,st:'new',f:false,fs:0})}
const st={hist:[],view:null,mode:'etappe',stage:'auto',tab:'learn',deck:null,ch:'all',queue:[],cur:null,answered:false,last:null,shown:0,ok:0};
function fmt(ts){return new Date(ts).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const MINQ=13;
function chapters(D){return [...new Set(D.q.map(q=>q.ch))]}
function stagesOf(D,ch){const out=[];
 for(const c of (ch==='all'?chapters(D):[ch])){const qs=D.q.filter(q=>q.ch===c);if(!qs.length)continue;
  const k=Math.ceil(qs.length/STAGE),sz=Math.ceil(qs.length/k);
  for(let i=0;i<k;i++)out.push({ch:c,i:i+1,k,qs:qs.slice(i*sz,(i+1)*sz)})}
 return out}
function stOf(q){const p=peek(q.id);return p?p.st:'new'}
function stageInfo(s){const now=Date.now();let n=0,l=0,pk=0,ps=0,due=0;
 for(const q of s.qs){const p=peek(q.id),t=p?p.st:'new';if(t==='new')n++;else if(t==='learn')l++;else if(t==='park')pk++;else{ps++;if(p.due!=null&&p.due<=now)due++}}
 return{n,l,pk,ps,due,t:s.qs.length}}
function stageDone(s){const i=stageInfo(s);return i.n+i.l+i.pk+i.due===0}
function curDeck(){return decks().find(x=>x.id===st.deck)}
function curStage(){const D=curDeck();if(!D)return null;const L=stagesOf(D,st.ch);if(!L.length)return null;
 let i=st.stage;
 if(i==='auto'||i==null||i>=L.length){i=L.findIndex(s=>!stageDone(s));if(i<0)i=L.length-1}
 return{L,i,s:L[i]}}
function errPool(){const D=curDeck();if(!D)return[];return D.q.filter(q=>(st.ch==='all'||q.ch===st.ch)&&(peek(q.id)||{}).f)}
function pool(){
 if(st.mode==='fehler')return errPool();
 const cs=curStage();if(!cs)return[];const now=Date.now();
 const open=q=>{const t=stOf(q);return t==='new'||t==='learn'};
 const learn=cs.s.qs.filter(open),parked=cs.s.qs.filter(q=>stOf(q)==='park');
 const dueP=cs.s.qs.filter(q=>{const p=peek(q.id);return p&&p.st==='pass'&&p.due!=null&&p.due<=now});
 let r;
 if(learn.length)r=learn.concat(parked.filter(q=>peek(q.id).due<=now),dueP);
 else r=parked.concat(dueP);
 if(learn.length&&r.length<MINQ){for(let j=cs.i+1;j<cs.L.length&&r.length<MINQ;j++)for(const q of cs.L[j].qs){if(open(q)&&!r.includes(q)){r.push(q);if(r.length>=MINQ)break}}}
 return r}
function buildQueue(){
 const key=q=>{const p=peek(q.id);return !p||p.st==='new'?0:p.st==='learn'?p.c:1.5};
 let p=shuffle(pool());
 p.sort((a,b)=>key(a)-key(b)+(Math.random()-.5)*2.5);
 if(st.last&&p.length>1&&p[0].id===st.last)p.push(p.shift());
 st.queue=p.map(q=>q.id);
}
function findQ(id){for(const d of decks()){const q=d.q.find(x=>x.id===id);if(q)return q}}
function next(){st.pick=null;st.view=null;
 if(!st.queue.length)buildQueue();
 const id=st.queue.shift();st.cur=id?findQ(id):null;st.answered=false;
 if(st.cur){const idx=shuffle([0,1,2,3]);st.order=idx}
 render();
}
function answer(i){st.pick=null;
 if(st.answered)return;st.answered=true;
 const q=st.cur,p=P(q.id),right=st.order[i]===q.a,now=Date.now();
 st.sel=i;st.right=right;p.seen++;st.shown++;st.last=q.id;st.msg='';
 if(st.mode==='fehler'){

(function(){
 const $=id=>document.getElementById(id);
 const K=()=>KEY;
 let loaded=null,strokes=[],cur=null,tab='c';
 function load(){const k=K();if(loaded===k)return;loaded=k;
  try{$('ntext').value=lsGet(k+'_note')||''}catch(e){}
  try{strokes=JSON.parse(lsGet(k+'_draw')||'[]')}catch(e){strokes=[]}
  redraw()}
 function saveN(){lsSet(K()+'_note',$('ntext').value)}
 function saveD(){lsSet(K()+'_draw',JSON.stringify(strokes))}
 const cv=$('ncv'),W=1000,H=320;
 function size(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;if(!r.width)return false;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);return true}
 function redraw(){if(!size())return;const x=cv.getContext('2d'),s=cv.width/W;x.clearRect(0,0,cv.width,cv.height);
  x.strokeStyle=getComputedStyle(document.body).color;x.lineWidth=2.6*s;x.lineCap='round';x.lineJoin='round';
  for(const st of strokes){x.beginPath();st.forEach((p,i)=>{i?x.lineTo(p[0]*s,p[1]*s):x.moveTo(p[0]*s,p[1]*s)});if(st.length===1)x.lineTo(st[0][0]*s+.1,st[0][1]*s);x.stroke()}}
 function pt(e){const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)/r.width*W*10)/10,Math.round((e.clientY-r.top)/r.height*H*10)/10]}
 function ok(e){return e.pointerType!=='touch'||$('nfin').checked}
 cv.addEventListener('pointerdown',e=>{if(!ok(e))return;e.preventDefault();cv.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);redraw()});
 cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();let evs=e.getCoalescedEvents?e.getCoalescedEvents():[];if(!evs.length)evs=[e];for(const ev of evs)cur.push(pt(ev));redraw()});
 const end=()=>{if(cur){cur=null;saveD()}};
 cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 $('nund').onclick=()=>{strokes.pop();redraw();saveD()};
 let armed=false;$('nclr').onclick=()=>{if(!armed){armed=true;$('nclr').textContent='Wirklich löschen? Nochmal tippen';setTimeout(()=>{armed=false;$('nclr').textContent='Zeichnung löschen'},3000);return}armed=false;$('nclr').textContent='Zeichnung löschen';strokes=[];redraw();saveD()};
 $('ntext').addEventListener('input',saveN);
 function show(t){tab=t;$('tcalc').classList.toggle('hide',t!=='c');$('tnote').classList.toggle('hide',t!=='n');$('ttc').classList.toggle('on',t==='c');$('ttn').classList.toggle('on',t==='n');if(t==='n'){load();setTimeout(redraw,30)}}
 function open(){load();$('tools').classList.remove('hide');document.body.classList.add('tools-open');show(tab)}
 function close(){$('tools').classList.add('hide');document.body.classList.remove('tools-open')}
 $('toolbtn').onclick=()=>{$('tools').classList.contains('hide')?open():close()};
 $('ttx').onclick=close;$('ttc').onclick=()=>show('c');$('ttn').onclick=()=>show('n');
 // Rechner
 const d=$('cdisp'),res=$('cres');
 function ev(){let s=d.value.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d),(\d)/g,'$1.$2').replace(/,/g,'.').replace(/\s+/g,'');
  if(!s)return null;if(!/^[0-9+\-*/().]+$/.test(s))throw 0;
  const v=Function('"use strict";return ('+s+')')();if(typeof v!=='number'||!isFinite(v))throw 0;return v}
 function fmt(v){return String(Math.round(v*1e6)/1e6).replace('.',',')}
 function calc(){try{const v=ev();res.textContent=v==null?'':'= '+fmt(v)}catch(e){res.textContent='…'}}
 d.addEventListener('input',calc);
 d.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();eq()}});
 function eq(){try{const v=ev();if(v!=null){d.value=fmt(v);res.textContent='= '+fmt(v)}}catch(e){res.textContent='Fehler'}}
 document.querySelectorAll('.calc button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
  if(k==='C'){d.value='';res.textContent=''}else if(k==='B'){d.value=d.value.slice(0,-1);calc()}else if(k==='='){eq()}else{d.value+=k;calc()}});
 window.addEventListener('resize',()=>{if(tab==='n'&&!$('tools').classList.contains('hide'))redraw()});
 window.toolsReload=()=>{if(loaded!==null&&loaded!==K()){loaded=null;strokes=[];$('ntext').value='';load()}};
})();
