<title>Lerntool</title>
<style>
:root{--bg:#0b0b0b;--fg:#F7F3E8;--mut:#a89f8c;--card:#161513;--bd:#2f2b22;--ac:#BD9B60;--ok:#6cc18b;--okbg:#1b2d22;--no:#f08a82;--nobg:#3a2321;--bar:#2a2620;color-scheme:dark}

*{box-sizing:border-box}body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(1100px 600px at 90% -10%,rgba(189,155,96,.16),transparent 62%),radial-gradient(900px 500px at -10% 108%,rgba(189,155,96,.10),transparent 62%);background-attachment:fixed;color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 60px}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 12px}.brand svg{width:60px;height:60px;flex:none}.brand small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}h1{font-size:19px;margin:0}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:9px 13px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#0b0b0b;font-weight:600}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.q{font-size:18px;font-weight:600;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.opt.pick{border:2px solid var(--ac);background:rgba(189,155,96,.16)}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--nobg);border-color:var(--no)}
.exp{border-left:4px solid var(--ac);padding:8px 12px;margin:10px 0;background:var(--bar);border-radius:6px}

<script>
const DATA=window.QUIZ;const BASE='quiz_'+(DATA.key||'default')+'_v1',PKEY=BASE+'_profiles';let KEY=BASE;
const DAY=864e5,NEED=5,GAP=14*DAY;
let S={progress:{},custom:[],upd:0};
const mem={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
let PR={list:(DATA.users&&DATA.users.length?DATA.users:['Ich']).map((n,i)=>({id:'p'+(i+1),name:n})),cur:'p1'};
try{const r=lsGet(PKEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.list)&&o.list.length)PR=o}}catch(e){}
if(!PR.list.some(x=>x.id===PR.cur))PR.cur=PR.list[0].id;
function keyOf(id){return id==='p1'?BASE:BASE+'_'+id}
function savePR(){lsSet(PKEY,JSON.stringify(PR))}
function loadProfile(){KEY=keyOf(PR.cur);S={progress:{},custom:[],upd:0};try{const r=lsGet(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
loadProfile();
let cmsg='';
function setMsg(m){cmsg=m;const e=document.getElementById('cstat');if(e)e.textContent=m}
function save(){S.upd=Date.now();lsSet(KEY,JSON.stringify(S));setMsg('Automatisch gespeichert auf diesem iPad ✓ '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}))}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function decks(){
 const d=JSON.parse(JSON.stringify(DATA.decks));
 const cu=d.find(x=>x.id==='custom');
 for(const q of S.custom){const t=d.find(x=>x.id===q.deck)||cu;t.q.push(q)}
 return d.filter(x=>x.q.length||x.id!=='custom');
}
function P(id){return S.progress[id]||(S.progress[id]={c:0,due:null,seen:0,wrong:0})}
function eligible(q,now){const p=S.progress[q.id];if(!p||p.c<NEED)return true;return p.due!=null&&p.due<=now}
const st={tab:'learn',deck:null,ch:'all',queue:[],cur:null,answered:false,last:null,shown:0,ok:0};
function fmt(ts){return new Date(ts).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const MINQ=13;
function pool(){const D=decks().find(x=>x.id===st.deck);if(!D)return[];const now=Date.now();
 const el=q=>eligible(q,now);
 if(st.ch==='all')return D.q.filter(el);
 const chs=[...new Set(D.q.map(q=>q.ch))],i=chs.indexOf(st.ch);
 let r=D.q.filter(q=>q.ch===st.ch&&el(q));
 if(!r.length)return r;
 for(let k=i+1;k<chs.length&&r.length<MINQ;k++)r=r.concat(D.q.filter(q=>q.ch===chs[k]&&el(q)));
 return r}
function buildQueue(){
 let p=shuffle(pool());
 p.sort((a,b)=>((S.progress[a.id]||{c:0}).c)-((S.progress[b.id]||{c:0}).c)+(Math.random()-.5)*2.5);
 if(st.last&&p.length>1&&p[0].id===st.last)p.push(p.shift());
 st.queue=p.map(q=>q.id);
}
function findQ(id){for(const d of decks()){const q=d.q.find(x=>x.id===id);if(q)return q}}
function next(){st.pick=null;
 if(!st.queue.length)buildQueue();
 const id=st.queue.shift();st.cur=id?findQ(id):null;st.answered=false;
 if(st.cur){const idx=shuffle([0,1,2,3]);st.order=idx}
 render();
}
function answer(i){st.pick=null;
 if(st.answered)return;st.answered=true;
 const q=st.cur,p=P(q.id),right=st.order[i]===q.a,now=Date.now();
 st.sel=i;st.right=right;p.seen++;st.shown++;st.last=q.id;
 if(right){st.ok++;const wasM=p.c>=NEED;p.c=Math.min(NEED,p.c+1);if(p.c>=NEED)p.due=now+GAP;st.msg=wasM?'Wiederholung bestanden – nächste Abfrage am '+fmt(p.due):(p.c>=NEED?'Geschafft! 5× richtig – erst wieder am '+fmt(p.due):'')}
 else{p.wrong++;if(p.c>=NEED){p.c=0;p.due=null;st.msg='Wiederholung falsch – Zähler zurück auf 0.'}else st.msg='';
  requeue(q.id)}
 save();render();
}
const GAPQ=12;
function requeue(id){
 const have=new Set(st.queue);have.add(id);
 if(st.queue.length<GAPQ){const extra=shuffle(pool().filter(x=>!have.has(x.id))).slice(0,GAPQ-st.queue.length);extra.forEach(x=>st.queue.push(x.id))}
 st.queue.splice(Math.min(GAPQ,st.queue.length),0,id)}
function dots(c){return '●'.repeat(c)+'○'.repeat(NEED-c)}
function viewLearn(){
 const ds=decks();if(!st.deck)st.deck=ds[0].id;
 const D=ds.find(x=>x.id===st.deck)||ds[0];
 const chs=[...new Set(D.q.map(q=>q.ch))];
 let h='<div class="row"><select id="sd">'+ds.map(d=>`<option value="${d.id}" ${d.id===st.deck?'selected':''}>${esc(d.name)} (${d.q.length})</option>`).join('')+'</select>'+
 '<select id="sc"><option value="all">Alle Kapitel</option>'+chs.map(c=>`<option ${c===st.ch?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')+'</select></div>';
 if(!st.cur){
  const n=pool().length;
  h+=`<div class="card"><div class="q">${n?n+' Fragen sind fällig oder noch offen.':'Alles erledigt 🎉'}</div>`+(n?'<button class="btn pri" id="go">Start</button>':'<div class="sm">Alle Fragen in dieser Auswahl sind gemeistert. Sie kommen automatisch nach 14 Tagen zur Wiederholung zurück (siehe Statistik).</div>')+'</div>';
 }else{
  const q=st.cur,p=P(q.id);
  h+=`<div class="card"><div class="meta"><span>${esc(q.ch)}</span><span class="dots" title="richtige Antworten">${dots(p.c)}</span></div><div class="q">${esc(q.q)}</div>${(DATA.svg&&DATA.svg[q.id])?`<div class="fig" role="img" aria-label="${esc(DATA.alt[q.id]||'')}">${(DATA.svg&&DATA.svg[q.id])}</div>`:''}`;
  st.order.forEach((oi,i)=>{
   let cl='';if(st.answered){if(oi===q.a)cl='ok';else if(i===st.sel)cl='no'}else if(st.pick===i)cl='pick'
   h+=`<button class="opt ${cl}" data-i="${i}" ${st.answered?'disabled':''}>${esc(q.o[oi])}</button>`});
  if(st.answered){
   h+=`<div class="exp"><b>${st.right?'✓ Richtig':'✗ Falsch'}</b>${st.right?'':' – richtig ist: <b>'+esc(q.o[q.a])+'</b>'}<br>${esc(q.e)}</div>`;
   const ik=(DATA.im&&DATA.im.q[q.id]);if(ik)h+='<div class="imgs">'+ik.map(k=>`<figure><img src="${DATA.im.imgs[k]}" alt="${esc(DATA.im.cap[k])}"><figcaption>${esc(DATA.im.cap[k])}</figcaption></figure>`).join('')+'</div>';
   const nt=(DATA.notes||{})[q.id];if(nt)h+=`<div class="note"><b>Recherche:</b> ${esc(nt)}</div>`;
   if(st.msg)h+=`<div class="sm" style="margin:6px 0">${esc(st.msg)}</div>`;
   h+='<button class="btn pri" id="nx">Weiter</button>';
  }
  h+=`</div><div class="sm">Diese Runde: ${st.ok}/${st.shown} richtig · noch ${st.queue.length} in der Warteschlange</div>`;
 }
 return h;
}
function stats(D){const now=Date.now();let n=0,l=0,m=0,due=0,nx=null;
 for(const q of D){const p=S.progress[q.id];
  if(!p||(p.c===0&&!p.seen)){n++}
  else if(p.c<NEED)l++;
  else if(p.due!=null&&p.due<=now)due++;
  else{m++;if(p.due&&(nx==null||p.due<nx))nx=p.due}}
 return{n,l,m,due,nx,t:D.length}}
function bar(s){const t=s.t||1;return `<div class="bar"><i style="width:${s.m/t*100}%;background:var(--ok)"></i><i style="width:${s.l/t*100}%;background:var(--ac)"></i><i style="width:${s.due/t*100}%;background:#d9a400"></i></div>`}
function viewStats(){
 let h='';
 for(const d of decks()){
  const s=stats(d.q);
  h+=`<div class="card"><b>${esc(d.name)}</b><div class="sm" style="margin:4px 0 8px">${s.t} Fragen · gemeistert ${s.m} · in Arbeit ${s.l} · neu ${s.n} · Wiederholung fällig ${s.due}${s.nx?' · nächste Fälligkeit '+fmt(s.nx):''}</div>${bar(s)}`;
  const chs=[...new Set(d.q.map(q=>q.ch))];
  h+='<div style="margin-top:10px">'+chs.map(c=>{const sc=stats(d.q.filter(q=>q.ch===c));return `<div style="margin:6px 0"><div class="sm">${esc(c)} – ${sc.m}/${sc.t} gemeistert</div>${bar(sc)}</div>`}).join('')+'</div></div>';
 }
 h+='<div class="sm">Grün = gemeistert (5× richtig, wartet 14 Tage) · Orange = in Arbeit · Gelb = Wiederholung fällig</div>';
 h+=`<div class="card" style="margin-top:12px"><b>Fortschritt sichern</b><div class="sm">Der Fortschritt liegt nur auf diesem iPad (Safari). Zum Sichern oder Übertragen auf ein anderes Gerät als Text kopieren:</div><textarea id="exp" readonly>${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:8px"><button class="btn" id="cp">Kopieren</button><button class="btn" id="imp">Aus Textfeld importieren</button><button class="btn" id="rs">Fortschritt zurücksetzen</button></div><div id="stmsg" class="sm"></div></div>`;
 return h;
}
function md(src){
 const L=src.split('\n');let h='',ul=false,tb=false,hd=false;
 const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
 const close=()=>{if(ul){h+='</ul>';ul=false}if(tb){h+='</table>';tb=false;hd=false}};
 for(const raw of L){const l=raw.trimEnd();
  if(/^\s*\|/.test(l)){if(/^\s*\|[\s\-|:]+\|\s*$/.test(l)){continue}
   if(ul){h+='</ul>';ul=false}
   const cells=l.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
   if(!tb){h+='<table>';tb=true;hd=false}
   const tag=hd?'td':'th';hd=true;h+='<tr>'+cells.map(c=>`<${tag}>${inl(c)}</${tag}>`).join('')+'</tr>';continue}
  if(tb){h+='</table>';tb=false;hd=false}
  if(/^### /.test(l)){close();h+='<h3>'+inl(l.slice(4))+'</h3>'}
  else if(/^## /.test(l)){close();h+='<h2>'+inl(l.slice(3))+'</h2>'}
  else if(/^\s*[-*] /.test(l)){if(!ul){h+='<ul>';ul=true}h+='<li>'+inl(l.replace(/^\s*[-*] /,''))+'</li>'}
  else if(!l.trim()){close()}
  else{close();h+='<p>'+inl(l)+'</p>'}}
 close();return h}
st.sum=(DATA.decks.find(d=>d.sum)||DATA.decks[0]).id;
function viewSum(){
 const ids=DATA.decks.filter(d=>d.sum);
 return '<div class="row"><select id="ss">'+ids.map(d=>`<option value="${d.id}" ${d.id===st.sum?'selected':''}>${esc(d.name)}</option>`).join('')+'</select></div><div class="card sum">'+md(DATA.decks.find(d=>d.id===st.sum).sum)+'</div>';
}
function viewAdd(){
 return `<div class="card"><b>Neue Fragen hinzufügen</b><div class="sm" style="margin:6px 0">Format: JSON-Liste. Pflicht: <code>q</code>, <code>o</code> (4 Antworten), <code>a</code> (Index der richtigen, 0–3), <code>e</code> (Erklärung). Optional: <code>ch</code> (Kapitel), <code>deck</code> (<code>${DATA.decks.map(d=>d.id).join('</code>, <code>')}</code>, sonst „Eigene Fragen“), <code>id</code>.</div>
<textarea id="addt" placeholder='[{"q":"…","o":["A","B","C","D"],"a":0,"e":"…","ch":"1 Thema"}]'></textarea>
<div class="row" style="margin-top:8px"><button class="btn pri" id="addb">Hinzufügen</button></div><div id="addm" class="sm"></div>
<div class="sm">Eigene Fragen: ${S.custom.length}</div></div>`;
}
function resetSt(){st.cur=null;st.queue=[];st.answered=false;st.pick=null;st.ok=0;st.shown=0;st.deck=null;st.ch='all'}
function profBar(){
 const e=$('prof');e.innerHTML='👤 <select id="pu">'+PR.list.map(p=>`<option value="${p.id}" ${p.id===PR.cur?'selected':''}>${esc(p.name)}</option>`).join('')+'</select><button class="btn" id="pn">+ Neu</button><button class="btn" id="pr">Umbenennen</button>'+(PR.list.length>1?'<button class="btn" id="pd">Löschen</button>':'')+'<div id="pbox" style="width:100%"></div>';
 $('pu').onchange=ev=>{save();PR.cur=ev.target.value;savePR();loadProfile();resetSt();setMsg('Benutzer gewechselt.');render()};
 const form=(label,val,ok)=>{const b=$('pbox');b.innerHTML=`<div class="row" style="margin-top:8px"><input id="pin" type="text" maxlength="24" value="${esc(val)}" placeholder="${label}" style="flex:1;min-width:140px;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)"><button class="btn pri" id="pok">OK</button><button class="btn" id="pcx">Abbrechen</button></div>`;$('pin').focus();$('pcx').onclick=()=>{b.innerHTML=''};$('pok').onclick=()=>{const v=$('pin').value.trim();if(v){ok(v);}}};
 $('pn').onclick=()=>form('Name des neuen Benutzers','',v=>{save();const id='p'+Date.now().toString(36);PR.list.push({id,name:v});PR.cur=id;savePR();loadProfile();resetSt();save();setMsg('Neuer Benutzer „'+v+'“ angelegt.');render()});
 $('pr').onclick=()=>form('Neuer Name',PR.list.find(p=>p.id===PR.cur).name,v=>{PR.list.find(p=>p.id===PR.cur).name=v;savePR();render()});
 if($('pd')){let armed=false;$('pd').onclick=()=>{if(!armed){armed=true;$('pd').textContent='Wirklich löschen? Nochmal tippen';return}
  try{localStorage.removeItem(KEY)}catch(e){delete mem[KEY]}
  PR.list=PR.list.filter(p=>p.id!==PR.cur);PR.cur=PR.list[0].id;savePR();loadProfile();resetSt();setMsg('Benutzer gelöscht.');render()}}
}
function render(){profBar();
 document.getElementById('nav').innerHTML=[['learn','Lernen'],['sum','Zusammenfassung'],['stats','Statistik'],['add','Fragen +']].map(([k,t])=>`<button data-t="${k}" class="${st.tab===k?'on':''}">${t}</button>`).join('');
 const v=document.getElementById('view');
 v.innerHTML=st.tab==='learn'?viewLearn():st.tab==='sum'?viewSum():st.tab==='stats'?viewStats():viewAdd();
 bind();
}
function $(id){return document.getElementById(id)}
function bind(){
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;render()});
 if(st.tab==='learn'){
  $('sd').onchange=e=>{st.deck=e.target.value;st.ch='all';st.cur=null;st.queue=[];render()};
  $('sc').onchange=e=>{st.ch=e.target.value;st.cur=null;st.queue=[];render()};
  if($('go'))$('go').onclick=()=>{st.ok=0;st.shown=0;st.queue=[];next()};
  if($('nx'))$('nx').onclick=()=>{
    if(!st.queue.length&&!pool().length){st.cur=null;render()}else next()};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(st.pick===i){st.pick=null;answer(i)}else{st.pick=i;render()}});
 }
 if(st.tab==='sum')$('ss').onchange=e=>{st.sum=e.target.value;render()};
 if(st.tab==='stats'){
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('exp').value);$('stmsg').textContent='Kopiert.'}catch(e){$('exp').select();$('stmsg').textContent='Text markiert – bitte manuell kopieren.'}};
  $('imp').onclick=()=>{try{const o=JSON.parse($('exp').value);if(!o||typeof o.progress!=='object')throw 0;S=Object.assign({progress:{},custom:[]},o);save();render();$('stmsg').textContent='Importiert.'}catch(e){$('stmsg').textContent='Ungültiger Text.'}};
  let armed=false;$('rs').onclick=()=>{if(!armed){armed=true;$('rs').textContent='Wirklich zurücksetzen? Nochmal tippen';return}S.progress={};save();st.cur=null;render()};
 }
 if(st.tab==='add')$('addb').onclick=()=>{
  const m=$('addm');
  try{let a=JSON.parse($('addt').value);if(!Array.isArray(a))a=[a];
   const all=new Set(decks().flatMap(d=>d.q.map(q=>q.id)));let n=0;
   for(const q of a){
    if(typeof q.q!=='string'||!Array.isArray(q.o)||q.o.length!==4||!Number.isInteger(q.a)||q.a<0||q.a>3||typeof q.e!=='string')throw new Error('Frage '+(n+1)+': Format falsch (q, o×4, a 0–3, e)');
    let id=q.id||('c-'+Date.now().toString(36)+'-'+n);while(all.has(id))id+='x';all.add(id);
    S.custom.push({id,ch:q.ch||'Eigene',q:q.q,o:q.o.map(String),a:q.a,e:q.e,deck:DATA.decks.some(x=>x.id===q.deck)?q.deck:'custom'});n++}
   save();m.textContent=n+' Fragen hinzugefügt.';$('addt').value='';
  }catch(e){m.textContent='Fehler: '+e.message}
 };
}
